services:
  # backend:
  #   build: .
  #   container_name: quantforge_backend
  #   ports:
  #     - "8000:8000"
  #   depends_on:
  #     - postgres
  #     - redis
  postgres: 
    image: postgres:16-alpine
    container_name: quantforge_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # redis:
  #     image: redis:7
  #     container_name: quantforge_redis

volumes:
  postgres_data: